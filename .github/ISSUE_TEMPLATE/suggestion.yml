name: Suggestion
description: Un exercice à ajouter, une explication à approfondir, un sujet manquant.
labels: ["suggestion"]
body:
  - type: input
    id: module
    attributes:
      label: Module ou sujet
      placeholder: "M13, ou « nouveau module : … »"
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: La proposition
      description: Ce qui manque, pourquoi c'est utile pour progresser, et si possible un exemple d'énoncé.
    validations:
      required: true
