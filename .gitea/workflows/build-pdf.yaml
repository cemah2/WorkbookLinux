# Miroir du dépôt sur la forge Gitea du laboratoire (lab-git, chapitre 0.8) :
# reconstruit les PDF à chaque push sur main et les publie en artefact.
# Nécessite un runner Gitea Actions (act_runner) enregistré avec le label
# ubuntu-latest : c'est le module 25 qui l'installe. Sur GitHub, c'est
# .github/workflows/pdf.yml qui fait ce travail.
name: build-pdf
on:
  push:
    branches: [main]
    paths: ["modules/**", "projets/**", "docs/**", "tools/**", ".gitea/workflows/**"]
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Le job tourne en root dans le conteneur du runner : pas de sudo.
      # TeX Live pèse ~1 Go : compter 5 à 6 min ; le module 25 montre
      # comment construire une image de runner qui l'embarque déjà.
      - name: Dépendances (pandoc, XeLaTeX, pypdf)
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            pandoc texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures python3 python3-pypdf
      - name: Contrôles du dépôt
        run: python3 tools/check_repo.py
      - name: Construction des PDF
        run: python3 tools/pdf/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: workbook-pdf
          path: build/Workbook-Linux-DevOps-*.pdf
          retention-days: 30
