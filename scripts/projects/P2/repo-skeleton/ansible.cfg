# ansible.cfg de la racine : Ansible ne lit que le ansible.cfg du répertoire
# COURANT. Celui-ci sert quand on lance ansible-playbook / ansible-lint depuis
# la racine du dépôt (Makefile, checks, rebuild.sh, pre-commit) ;
# ansible/ansible.cfg sert quand on lance depuis ansible/ (CI).
# Les chemins sont relatifs à ce fichier.
[defaults]
inventory = ansible/inventory/staging.ini
roles_path = ansible/roles
collections_path = ansible/collections
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
vault_password_file = .vault-pass
forks = 10
timeout = 20

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
